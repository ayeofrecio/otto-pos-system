{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cashier Login</title>

    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <link rel="stylesheet" href="{% static 'css/components.css' %}">

    <link rel="stylesheet" href="{% static 'css/pages/login.css' %}">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <header class="login-header">

                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch theme"
                    title="Switch theme">
                    ☀
                </button>


                <div class="brand-mark" aria-hidden="true">
                    POS
                </div>


                <h1>
                    Cashier Login
                </h1>


                <p class="login-subtitle">
                    Sign in to access the point of sale
                </p>


                {% if store_name %}
                <p class="store-name">
                    {{ store_name }}
                </p>
                {% endif %}

            </header>


            {% if error %}

            <div class="alert alert--danger" role="alert">

                <span class="alert__icon" aria-hidden="true">
                    !
                </span>

                <span>
                    {{ error }}
                </span>

            </div>

            {% endif %}


            <form method="post" action="{% url 'pos_login' %}">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input id="username" type="text" name="username" class="input" placeholder="Enter your username"
                        autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">

                        <input id="password" type="password" name="password" class="input password-field__input"
                            placeholder="Enter your password" autocomplete="current-password" required>

                        <button type="button" class="password-field__toggle" id="togglePassword"
                            aria-label="Show password" title="Show password">
                            Show
                        </button>

                    </div>

                </div>


                <button type="submit" class="btn btn--primary btn--full">
                    Sign In
                </button>

            </form>


            <footer class="login-footer">
                POS System
            </footer>

        </section>

    </main>


    <script>

        /* =========================================================
           PASSWORD VISIBILITY
        ========================================================= */

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener("click", () => {

            const isPassword =
                passwordInput.type === "password";


            passwordInput.type =
                isPassword ? "text" : "password";


            togglePassword.textContent =
                isPassword ? "Hide" : "Show";


            togglePassword.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

        });


        /* =========================================================
           THEME
        ========================================================= */

        const themeToggle =
            document.getElementById("themeToggle");


        const savedTheme =
            localStorage.getItem("pos-theme");


        if (savedTheme === "dark") {

            document.documentElement.dataset.theme = "dark";

            themeToggle.textContent = "☾";

        }


        themeToggle.addEventListener("click", () => {

            const isDark =
                document.documentElement.dataset.theme === "dark";


            if (isDark) {

                delete document.documentElement.dataset.theme;

                localStorage.setItem(
                    "pos-theme",
                    "light"
                );

                themeToggle.textContent = "☀";

            } else {

                document.documentElement.dataset.theme = "dark";

                localStorage.setItem(
                    "pos-theme",
                    "dark"
                );

                themeToggle.textContent = "☾";

            }

        });

    </script>

</body>

</html>
