{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Open POS Session</title>

    <script>
        try {
            if (localStorage.getItem("pos-theme") === "dark") {
                document.documentElement.dataset.theme = "dark";
            }
        } catch (e) { }
    </script>
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <link rel="stylesheet" href="{% static 'css/components.css' %}">

    <link rel="stylesheet" href="{% static 'css/pages/open-session.css' %}">
</head>

<body>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        ☀
    </button>
    <main class="session-page">

        <section class="session-card">

            <header class="session-header">

                <h1>
                    Open POS Session
                </h1>

                <p class="session-subtitle">
                    Enter the starting cash in your drawer
                </p>

            </header>

            <form method="post">

                {% csrf_token %}

                <div class="money-input">

                    <span class="money-input__currency">
                        ₱
                    </span>

                    <input type="number" name="opening_cash" value="3000" step="0.01" placeholder="0.00" autofocus
                        required>

                </div>

                <p class="session-hint">
                    This amount will be used as the opening balance.
                </p>

                <button type="submit" class="btn btn--primary">
                    Start Session
                </button>

            </form>

            <div class="session-logout">

                <a href="{% url 'pos_logout' %}" class="btn btn--secondary">
                    Logout
                </a>

            </div>

        </section>

    </main>

    <script>
        const root = document.documentElement;
        const themeToggle = document.getElementById("themeToggle");

        function syncToggle() {
            const dark = root.dataset.theme === "dark";
            themeToggle.textContent = dark ? "☾" : "☀";
            themeToggle.setAttribute("aria-pressed", dark);
        }

        themeToggle.addEventListener("click", () => {
            const next = root.dataset.theme === "dark" ? "light" : "dark";
            if (next === "dark") root.dataset.theme = "dark";
            else delete root.dataset.theme;
            try { localStorage.setItem("pos-theme", next); } catch (e) { }
            syncToggle();
        });

        syncToggle();
    </script>
</body>

</html>
