{% load static %}

    <header class="header">
        <div class="header-left">
            <span class="store-name">{{ store_name|default:"POS Store" }}</span>
            <span class="date" id="live-date">{{ date }}</span>
            <span class="receipt-no">Receipt #{{ receipt_no }}</span>
            <span class="cashier">Cashier: {{ cashier }}</span>
        </div>

                    </g>

                            opacity=".5" />
                    </g>
                </svg>
            </button>

            <span class="time" id="live-time">{{ time }}</span>
            {% if request.user.is_superuser %}
            <a href="{% url 'sales:admin_posnbr_init' %}" class="btn btn-secondary">POSNBR</a>
            {% endif %}
            <a href="{% url 'pos_logout' %}" class="btn btn-secondary">Logout</a>
        </div>
    </header>
