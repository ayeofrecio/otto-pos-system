
<footer class="actions">
    <!-- Primary Actions -->
    <button type="button" class="btn-fn btn-fn-pay" id="pay-trigger-btn" hx-get="{% url 'sales:pay' %}"
        hx-target="#pay-modal-content" hx-swap="innerHTML" hx-trigger="click"
        onclick="document.getElementById('pay-modal').classList.add('open')">
        <span class="fn-key" id="key-paymnt">p</span><span class="fn-label">💳 Pay</span>
    </button>


    <!-- Function Key Buttons - Grid Layout -->
    <div class="actions-fn-grid">
        <!-- Search & Inquiry -->
        <button type="button" class="btn-fn btn-fn-grey" onclick="openSearchModal()" title="Search items">
            <span class="fn-key" id="key-search">F1</span><span class="fn-label">🔍 Search</span>
        </button>


        <!-- Discounts -->
        <button type="button" class="btn-fn btn-fn-green" onclick="openDiscountModal()"
            title="Item discount — applies to next scan only">
            <span class="fn-key" id="key-idisc">F12</span><span class="fn-label">Item Disc</span>
        </button>
        <button type="button" class="btn-fn btn-fn-blue" onclick="openTransDiscModal()"
            title="Subtotal discount — applies to entire transaction">
            <span class="fn-key" id="key-stdisc">F11</span><span class="fn-label">Sub Disc</span>
        </button>
        <button type="button" class="btn-fn btn-fn-orange" onclick="triggerPriceOverride()"
            title="Override selected line item price">
            <span class="fn-key" id="key-prover">F4</span><span class="fn-label">Price Ovr</span>
        </button>

        <button type="button" class="btn-fn btn-fn-orange" onclick="window.triggerItemReturn()"
            title="Tag selected line as item return">
            <span class="fn-key" id="key-iret">F5</span><span class="fn-label">Item Return</span>
        </button>


        <!-- Void Operations -->
        <button type="button" class="btn-fn btn-fn-orange" onclick="window.triggerVoidItem()"
            title="Void single line item">
            <span class="fn-key" id="key-ivoid">F8</span><span class="fn-label">Void Item</span>
        </button>
        <button type="button" class="btn-fn btn-fn-orange" onclick="window.triggerVoidTransaction()"
            title="Void entire transaction">
            <span class="fn-key" id="key-voidtr">F7</span><span class="fn-label">Void Trans</span>
        </button>
        <button type="button" class="btn-fn btn-fn-orange" onclick="window.triggerVoidPrevious()"
            title="Void previous transaction by receipt number">
            <span class="fn-key" id="key-ivoida">F6</span><span class="fn-label">Void Prev</span>
        </button>

        <button type="button" class="btn-fn btn-fn-grey" id="suspend-trigger-btn"
            onclick="window.openSuspendModal()" title="Suspend or retrieve transaction">
            <span class="fn-key" id="key-susrt">F3</span><span class="fn-label">Suspend/Retrieve <span id="suspended-count-badge" class="suspend-badge{% if suspended_count|default:0 == 0 %} is-zero{% endif %}">{{ suspended_count|default:0 }}</span></span>
        </button>

        <button type="button" class="btn-fn btn-fn-blue" onclick="openCashInOutModal('OUT')"
            title="Record cash drawer movement">
            <span class="fn-key" id="key-cwithd">CWD</span><span class="fn-label">Cash In/Out</span>
        </button>

        <!-- Admin -->
        <button type="button" class="btn-fn btn-fn-red" onclick="openCloseTransModal()"
            title="Close cashier session">
            <span class="fn-key">CLS</span><span class="fn-label">Close Session</span>
        </button>
    </div>
</footer>
